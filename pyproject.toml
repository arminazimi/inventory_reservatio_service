[project]
name = "ir"
version = "0.1.0"
description = "Inventory reservation service for reliable e-commerce checkout"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.141.1",
    "httpx>=0.28,<1",
    "prometheus-client>=0.22,<1",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25,<26",
    "tenacity>=9,<10",
    "uvicorn>=0.52.0",
]

[project.scripts]
reservation-expiration-worker = "inventory_reservation.controller.expiration_worker:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "inventory_reservation"
module-root = ""

[project.optional-dependencies]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "respx>=0.22,<1",
    "ruff>=0.14,<1",
    "testcontainers[postgres]>=4.13,<5",
]

[tool.fastapi]
entrypoint = "inventory_reservation.controller.main:app"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--showlocals",
]
asyncio_mode = "auto"
markers = [
    "integration: requires a real infrastructure dependency",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["inventory_reservation"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "FAST",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "RUF",
    "SIM",
    "T20",
    "UP",
]
ignore = [
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true
